name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no .planning/ path is tracked
        run: |
          ! git ls-files | grep '^\.planning/'
      - name: Run Nyquist validation suite
        run: python3 tests/validate_plugin.py

  claude-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deliberately unpinned (D-02/D-03, ROADMAP phase 13) — always installs
      # the latest published CLI. If this job reds on an unrelated upstream
      # release rather than this repo's own content, the remedy is a
      # deliberate temporary pin (npm install -g @anthropic-ai/claude-code@
      # <version>) here — not reverting this job to best-effort/advisory
      # mode. See CONTRIBUTING.md.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run claude plugin validate
        run: claude plugin validate . --strict
